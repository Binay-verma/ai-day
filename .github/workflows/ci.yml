name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check edgecopilot tests
      - name: Types
        run: mypy edgecopilot
      - name: Security (static)
        run: bandit -q -r edgecopilot -c pyproject.toml
      - name: Dependency vulnerabilities
        run: pip-audit --skip-editable
      - name: Config lint
        run: python -m edgecopilot.config_schema configs/campus.yaml
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python: ["3.10", "3.11", "3.12"]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}", cache: pip}
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov --cov-report=term-missing --cov-fail-under=75
  release-artifacts:
    runs-on: ubuntu-latest
    needs: [quality, test]
    permissions: {contents: read, id-token: write, attestations: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install build && pip install -e . && python -m build --wheel
      - name: SBOM (CycloneDX, incl. ML models when present)
        run: python scripts/make_sbom.py > sbom.cdx.json
      - name: Build provenance (SLSA)
        uses: actions/attest-build-provenance@v1
        with: {subject-path: "dist/*.whl"}
      - uses: actions/upload-artifact@v4
        with: {name: release, path: "dist/*.whl\nsbom.cdx.json"}
      - run: docker build -t edge-copilot:ci .
