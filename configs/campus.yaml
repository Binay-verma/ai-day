# Explainable Edge AI Copilot - campus deployment configuration
# Everything an operator might want to audit lives here: model files, cue
# weights (the explanation IS this model), thresholds, zones and playbooks.

runtime:
  threads: 2              # ORT intra-op threads (match the edge CPU cores)
  privacy: blur           # raw | blur | skeleton  (what leaves the device)
  motion_gate: true       # skip heavy models on static frames
  gate_keepalive: 8       # ...but always run every N frames
  fire_every: 2           # run the fire/smoke detector every N processed frames
  max_width: 960          # downscale very large frames before processing
  scene_cut: 0.75         # fraction of changed pixels that means "camera moved / feed switched"
  realert_cooldown_s: 30  # the same hazard on the same subject re-opens its incident instead of a new alert

models:
  pose:
    path: models/yolo11n-pose.onnx
    imgsz: 640
    conf: 0.35
    iou: 0.5
  fire_smoke:
    path: models/fire_smoke.onnx
    classes: [fire, smoke]
    imgsz: 640
    conf: 0.25
    iou: 0.45

# Additive log-odds models: logit = bias + sum_i r_i * w_i * (clip(x_i, lo, hi) - ref_i)
# phrase = how the cue is verbalised in explanations (v = measured value)
# lo == ref makes a cue ONE-SIDED: it can only add risk. Used where absence of
# evidence is not evidence of absence (a quiet room does not rule out panic).
hazards:
  fall:
    bias: -7.0
    threshold: 0.6
    cues:
      torso_angle:   {weight: 0.06, ref: 30.0, lo: 0.0, hi: 90.0, unit: deg, phrase: "torso tilted {v:.0f} deg from vertical", keywords: [tilted]}
      descent_speed: {weight: 2.0, ref: 0.4, lo: 0.0, hi: 3.0, unit: "body-heights/s", phrase: "a rapid descent of {v:.1f} body-heights/s", keywords: [descent]}
      tilt_rate:     {weight: 0.02, ref: 60.0, lo: 0.0, hi: 400.0, unit: "deg/s", phrase: "the torso rotating {v:.0f} deg/s", keywords: [rotating, rotation]}
      height_drop:   {weight: 3.0, ref: 0.3, lo: 0.0, hi: 1.0, unit: "", phrase: "body height dropped by {v:.0%}", keywords: [height dropped]}
      aspect_ratio:  {weight: 1.5, ref: 0.8, lo: 0.2, hi: 3.0, unit: "", phrase: "a horizontal body shape (width/height {v:.1f})", keywords: [horizontal, shape]}
      ground_time:   {weight: 0.5, ref: 1.0, lo: 0.0, hi: 10.0, unit: s, phrase: "no movement on the ground for {v:.1f} s", keywords: [ground, movement]}
  fire_smoke:
    bias: -6.0
    threshold: 0.6
    cues:
      smoke_conf:    {weight: 6.0, ref: 0.2, lo: 0.0, hi: 1.0, unit: "", phrase: "the detector seeing smoke ({v:.0%} confidence)", keywords: [seeing smoke]}
      fire_conf:     {weight: 7.0, ref: 0.2, lo: 0.0, hi: 1.0, unit: "", phrase: "the detector seeing flames ({v:.0%} confidence)", keywords: [seeing flames]}
      smoke_density: {weight: 10.0, ref: 0.03, lo: 0.0, hi: 0.5, unit: "", phrase: "a smoke density increase of {v:.2f}", keywords: [density, haze]}
      smoke_growth:  {weight: 8.0, ref: 0.0, lo: -0.2, hi: 0.3, unit: "/s", phrase: "smoke spreading at {v:.2f}/s", keywords: [spreading, growth]}
      fire_flicker:  {weight: 0.3, ref: 0.5, lo: 0.0, hi: 20.0, unit: "per mille", phrase: "flickering flame-coloured pixels ({v:.1f} per mille)", keywords: [flicker, flickering]}
      smoke_ppm:     {weight: 0.006, ref: 300.0, lo: 0.0, hi: 1500.0, unit: ppm, phrase: "the MQ-2 sensor reading {v:.0f} ppm", source: sensor, keywords: [mq-2, sensor reading, ppm]}
      temp_rise:     {weight: 0.5, ref: 1.0, lo: 0.0, hi: 20.0, unit: "C/min", phrase: "temperature rising {v:.1f} C/min", source: sensor, keywords: [temperature]}
      rapid_exit:    {weight: 2.0, ref: 0.3, lo: 0.0, hi: 1.0, unit: "", phrase: "rapid exit movement (crowd flow index {v:.2f})", source: context, keywords: [exit, crowd]}
  crowd:
    bias: -5.0
    threshold: 0.6
    cues:
      occupancy:     {weight: 4.0, ref: 0.8, lo: 0.8, hi: 3.0, unit: "x capacity", phrase: "occupancy at {v:.0%} of zone capacity", keywords: [occupancy, capacity]}
      surge:         {weight: 0.8, ref: 2.0, lo: 0.0, hi: 15.0, unit: "x normal", phrase: "people moving {v:.1f}x faster than normal", keywords: [faster]}
      exodus:        {weight: 4.0, ref: 0.2, lo: 0.0, hi: 1.0, unit: "", phrase: "{v:.0%} of the people in view leaving within seconds", keywords: [leaving, left]}
      divergence:    {weight: 2.0, ref: 0.3, lo: -2.0, hi: 4.0, unit: "body-heights/s", phrase: "people scattering outwards ({v:.1f} body-heights/s)", keywords: [scattering, outwards]}
      coherence:     {weight: 1.0, ref: 0.5, lo: 0.5, hi: 1.0, unit: "", phrase: "people moving in one direction (coherence {v:.2f})", keywords: [direction, coherence]}
      sound_db:      {weight: 0.08, ref: 75.0, lo: 75.0, hi: 120.0, unit: dB, phrase: "sound level {v:.0f} dB", source: sensor, keywords: [sound]}

# Temporal smoothing / hysteresis per (hazard, subject)
hysteresis:
  alpha: 0.6
  on_frames: 2
  off_frames: 30
  off_margin: 0.15

feedback:
  lr: 0.5          # online intercept update per operator label
  max_shift: 2.0   # one zone can never be silenced completely

contacts:
  emergency: "112"
  ambulance: "108"
  fire_service: "101"
  security_desk: "Campus security desk (ext. 2222)"

zones:
  default:
    capacity: 40
    exits: [Exit 1, Exit 2]
    aed: AED at reception
    extinguisher: CO2 extinguisher near Exit 1
    first_aid: first-aid team (ext. 2311)
    assembly_point: Assembly Point A (main lawn)
    warden: floor warden
  Corridor B:
    capacity: 30
    exits: [East stairwell, West stairwell]
    aed: AED outside Room B-104
    extinguisher: ABC extinguisher near B-110
    first_aid: first-aid team (ext. 2311)
    assembly_point: Assembly Point B (parking lot)
    warden: Block B warden
  Lab Block A:
    capacity: 60
    exits: [Main door, Emergency exit A2]
    aed: AED at Lab A entrance
    extinguisher: CO2 extinguisher by the fume hoods
    first_aid: first-aid team (ext. 2311)
    assembly_point: Assembly Point A (main lawn)
    warden: Lab safety officer
  Auditorium:
    capacity: 300
    exits: [Front doors, Side exit S1, Side exit S2]
    aed: AED at the stage left wing
    extinguisher: extinguishers at each side exit
    first_aid: first-aid team (ext. 2311)
    assembly_point: Assembly Point C (sports ground)
    warden: Auditorium marshal

# Playbooks: instantiated with zone facts; `when` uses cue names + prob
playbooks:
  fall:
    - {do: "Send {first_aid} to {zone} for {subject}", priority: 1}
    - {do: "Bring the {aed}", priority: 2, when: "ground_time > 8"}
    - {do: "Call an ambulance ({ambulance}) - person motionless for {ground_time} s", priority: 1, when: "ground_time > 15", escalate: true}
    - {do: "Do not move the person until trained help arrives", priority: 3}
  fire_smoke:
    - {do: "Alert {warden} and verify on camera / in person", priority: 1}
    - {do: "Use the {extinguisher} only if the fire is small and the exit is behind you", priority: 2, when: "fire_conf > 0.3 or fire_flicker > 2"}
    - {do: "Trigger evacuation via {exits}; assemble at {assembly_point}", priority: 1, when: "prob > 0.85 or smoke_ppm > 600", escalate: true}
    - {do: "Call fire service ({fire_service})", priority: 1, when: "prob > 0.9", escalate: true}
  crowd:
    - {do: "Notify {security_desk} and the {warden}", priority: 1}
    - {do: "Open all exits ({exits}) and stop further entry to {zone}", priority: 1, when: "occupancy > 1.0"}
    - {do: "Make a calm PA announcement directing people to {exits}", priority: 2, when: "surge > 3"}
    - {do: "Check for a triggering incident (fire/fall) near {zone}", priority: 2, when: "coherence > 0.6"}

# ALARM vs VERIFY routing from the evidence ledger
triage:
  min_margin: 1.0      # log-odds above the alert line needed for ALARM
  max_conflict: 0.35   # |sum of negative contributions| / sum of positive ones
  strong: 0.5          # a cue this strong against = cross-modal disagreement
