# Fall-critical cameras: larger pose model (YOLO11s-pose), expert cue weights unchanged.
# Expert weights need several cues to agree (tilt, body shape, descent, time on the ground);
# the GMDCSA-fitted alternative (fall_fitted_gmdcsa.yaml) does not transfer - see RESULTS section 8.
# Costs ~3x the CPU of the default pose model, so use it per camera (cameras[].pose) where falls matter most.
extends: ../campus.yaml
models:
  pose:
    path: models/yolo11s-pose.onnx
