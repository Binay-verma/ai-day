# Production broker: TLS only, per-device credentials, no anonymous access.
# Certificates from the campus CA:  ca.crt, server.crt, server.key  (mounted at /mosquitto/certs)
# Device accounts:  mosquitto_passwd -c /mosquitto/config/passwd esp32-lab-a-1
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence false
