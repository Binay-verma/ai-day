# Alerts about the SAFETY SYSTEM itself (who watches the watcher)
groups:
  - name: edgecopilot-health
    rules:
      - alert: CopilotDown
        expr: up{job="edgecopilot"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Edge copilot is not responding - campus cameras are unmonitored"}
      - alert: CameraNotLive
        expr: edgecopilot_camera_up == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Camera {{ $labels.camera }} is offline/stale"}
      - alert: CameraTamper
        expr: edgecopilot_camera_fault == 1
        for: 30s
        labels: {severity: high}
        annotations: {summary: "Camera {{ $labels.camera }}: {{ $labels.kind }}"}
      - alert: CopilotSlow
        expr: histogram_quantile(0.95, sum by (camera, le) (rate(edgecopilot_frame_latency_seconds_bucket[5m]))) > 0.4
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Processing latency p95 above 400 ms on {{ $labels.camera }}"}
      - alert: NotificationFailures
        expr: increase(edgecopilot_notifications_total{ok="false"}[15m]) > 3
        labels: {severity: high}
        annotations: {summary: "Alert notifications are failing"}
      - alert: SensorStale
        expr: edgecopilot_sensor_age_seconds > 60
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Sensor {{ $labels.sensor }} in {{ $labels.zone }} silent for over a minute"}
      - alert: AlertRateDrift
        # far more alerts than the conformal budget predicts: scene changed, camera moved, or a bug
        expr: sum by (camera, hazard) (increase(edgecopilot_alerts_total[6h])) > 10
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.camera }} raised over 10 {{ $labels.hazard }} alerts in 6 h - re-check calibration"}
      - alert: CameraFramesStale
        expr: edgecopilot_last_frame_age_seconds > 30 and on (camera) edgecopilot_camera_paused == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "No frame processed on {{ $labels.camera }} for 30 s although it is not paused"}
      - alert: CameraPausedLong
        expr: edgecopilot_camera_paused == 1
        for: 2h
        labels: {severity: warning}
        annotations: {summary: "AI analysis on {{ $labels.camera }} has been paused for over 2 h"}
  - name: edgecopilot-model-drift
    rules:
      - alert: HighDismissalRate
        # most alerts dismissed by operators: the scene no longer matches calibration (ISO 42001 A.6.2.6)
        expr: |
          sum by (camera, hazard) (increase(edgecopilot_operator_feedback_total{outcome="dismissed"}[24h]))
            / clamp_min(sum by (camera, hazard) (increase(edgecopilot_operator_feedback_total[24h])), 1) > 0.5
          and sum by (camera, hazard) (increase(edgecopilot_operator_feedback_total[24h])) >= 4
        labels: {severity: warning}
        annotations: {summary: "Over half of {{ $labels.hazard }} alerts on {{ $labels.camera }} dismissed in 24 h - record new normal footage and re-calibrate"}
      - alert: AlertLineAtCeiling
        # calibration pushed the alert line to max_threshold: the camera is as insensitive as policy allows
        expr: edgecopilot_alert_threshold >= 0.899
        for: 10m
        labels: {severity: high}
        annotations: {summary: "{{ $labels.hazard }} alert line on {{ $labels.camera }} is at its ceiling - review dismissals and calibration"}
  - name: edgecopilot-slo
    rules:
      - record: edgecopilot:camera_availability:ratio_1h
        expr: avg_over_time(edgecopilot_camera_up[1h])
      - alert: CameraAvailabilitySLOBurn
        # SLO: each camera live >= 99.5 % of the time; fast burn = more than 14x budget over 1 h
        expr: (1 - edgecopilot:camera_availability:ratio_1h) > 14 * 0.005
        labels: {severity: high}
        annotations: {summary: "{{ $labels.camera }} is burning its availability error budget"}
